		function TodayLozim(loz){
			let new_lozim = loz.trim().split("\n\n").map(b => b.trim()).filter(Boolean);
			let lozim = new_lozim.map(l => l.split("\n")[0]);
			let locations = new_lozim.map(l => l.split("\n")[1] || "");
			return [lozim, locations];
		}
		
		function InLoz(loz, people) {
			loz = loz.split('| ').pop().split(', ');
			let people_in = [];
			for (let i of loz) {
				for (let p of people){
					if (Array.isArray(p)) {
						for (let new_p of p) {
							if (i === new_p){
								if (people_in.length === 0) { people_in.push(`${new_p}`); }
								else {
									people_in.push(`${new_p}`);
									break;
								}
							}
						}
					}
					else if (i === p) {
						if (people_in.length === 0) { people_in.push(`${p}`); }
						else { people_in.push(`${p}`); }
						break;
					}
				}
			}
			return people_in;
		}
		
		function IfInLoz(p, people, mate, mate_2, mana, masolim, samsolim, samnaot) {
			for (let i of people) {
				if (p === i) { return true; }
				
				else if (i === "מטה") {
					for (let j of mate) { if (p === j) { return true; } }
				}
				
				else if (i === "מטה 2") {
					for (let j of mate_2) { if (p === j) { return true; } }
				}
				
				else if (i === "מנ״ע") {
					for (let j of mana) { if (p === j) { return true; } }
				}
				
				else if (i === "מסו״לים") {
					for (let j of masolim) { if (p === j) { return true; } }
				}
				
				else if (i === "סמסו״לים") {
					for (let j of samsolim) { if (p === j) { return true; } }
				}
				
				else if (i === "סמנ״אות") {
					for (let j of samnaot) { if (p === j) { return true; } }
				}
			}
			
			return false
		}

	function GetStatus(person) {
	
	    let selected = document.querySelector(
	        `input[name="${person}_status"]:checked`
	    );
	
	    if (!selected) {
	        return "missing";
	    }
	
	    return selected.value;
	}
	
	function GetHour(loz) {
	
	    let match = loz.match(/^(\d{1,2}):(\d{2})/);
	
	    if (!match) {
	        return 0;
	    }

    return Number(match[1]);
}
