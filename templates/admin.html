<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול מספרי טלפון</title>

    <style>

        body{

            margin:0;
            background:linear-gradient(135deg,#EEF4FF,#DCEBFF);
            font-family:Arial;
            display:flex;
            flex-direction:column;
            align-items:center;

        }

        h1{

            margin-top:50px;
        
            text-align:center;
        
            color:#173B78;
        
            font-size:38px;
        
            line-height:1.4;
        
            font-weight:700;
        
        }

        .card{

            width:90%;
            max-width:520px;
        
            background:white;
        
            margin-top:35px;
        
            padding:45px;
        
            border-radius:28px;
        
            box-shadow:
                0 12px 35px rgba(0,0,0,.10);
        
            transition:all .25s ease;
        
        }

        .card:hover{

            transform:translateY(-4px);
        
            box-shadow:0 18px 45px rgba(0,0,0,.12);
        
        }

        h2{

            text-align:center;
            color:#2E5CB8;
            margin-bottom:35px;

        }

        label{

            display:block;
            margin-top:20px;
            margin-bottom:8px;
            font-weight:bold;

        }

        select,
        input{
        
            width:100%;
        
            padding:16px;
        
            font-size:17px;
        
            border-radius:14px;
        
            border:1px solid #D6DEEB;
        
            background:#FAFCFF;
        
            box-sizing:border-box;
        
            transition:all .25s ease;
        
            outline:none;
        
        }

        select:focus,
        input:focus{
        
            border-color:#3B82F6;
        
            box-shadow:0 0 0 4px rgba(59,130,246,.15);
        
        }

        button{

    width:100%;

    margin-top:35px;

    padding:16px;

    font-size:19px;

    font-weight:bold;

    border:none;

    border-radius:14px;

    background:linear-gradient(135deg,#3B82F6,#2563EB);

    color:white;

    cursor:pointer;

    transition:all .25s ease;

    box-shadow:0 8px 18px rgba(37,99,235,.25);

}

button:hover{

    transform:translateY(-2px);

    box-shadow:0 12px 24px rgba(37,99,235,.35);

}

button:active{

    transform:translateY(1px);

}

        header{

    width:100%;

    background:white;

    padding:18px 40px;

    box-sizing:border-box;

    display:flex;

    justify-content:space-between;

    align-items:center;

    box-shadow:0 2px 12px rgba(0,0,0,.08);

}

.logo{

    font-size:24px;

    font-weight:bold;

    color:#173B78;

}

.home-button{

    text-decoration:none;

    color:#2563EB;

    font-weight:bold;

    transition:.2s;

}

.home-button:hover{

    color:#173B78;

}

        @media (max-width: 600px){

    body{

        padding:20px;

    }

    header{

        padding:15px 20px;

    }

    .logo{

        font-size:20px;

    }

    h1{

        font-size:28px;

        margin-top:30px;

    }

    .card{

        width:100%;

        padding:25px;

        margin-top:20px;

        border-radius:20px;

    }

    h2{

        font-size:24px;

    }

    label{

        font-size:16px;

    }

    select,
    input,
    button{

        font-size:16px;

        padding:14px;

    }

}

.modal{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.45);

    display:none;

    justify-content:center;

    align-items:center;

    z-index:999;

}

.modal-content{

    background:white;

    width:90%;

    max-width:380px;

    padding:30px;

    border-radius:20px;

    box-shadow:0 20px 50px rgba(0,0,0,.25);

    text-align:center;

}

.modal-content h3{

    margin-top:0;

    color:#173B78;

    font-size:28px;

}

.modal-content p{

    margin:20px 0;

    color:#555;

}

.modal-buttons{

    display:flex;

    gap:12px;

    margin-top:25px;

}

.modal-buttons button{

    flex:1;

    margin-top:0;

}
        
    </style>

</head>

<body>

<header>

    <div class="logo">
        📱 Loz System
    </div>

    <a href="/" class="home-button">
        🏠 דף הבית
    </a>

</header>
    
<h1>ניהול מספרי טלפון</h1>

<div class="card">

    <h2>✏️ עריכת איש קשר</h2>

    <label>👤 תפקיד</label>

    <select id="role">

        {% for phone in phones %}

        <option value="{{ phone[0] }}">
            {{ phone[0] }}
        </option>

        {% endfor %}

    </select>

    <label>📞 מספר טלפון</label>

    <input
        id="number"
        type="text"
    >

    <button id="save">

        💾 שמור

    </button>

    <p id="message"></p>

    <div id="codeModal" class="modal">

    <div class="modal-content">

        <h3>🔒 אימות</h3>

        <p>כדי לשמור שינויים הכנס קוד גישה</p>

        <input
            type="password"
            id="adminCode"
            placeholder="קוד גישה"
        >

        <div class="modal-buttons">

            <button id="cancelBtn">
                ביטול
            </button>

            <button id="confirmBtn">
                אישור
            </button>

        </div>

    </div>

</div>

</div>

<script>

const role = document.getElementById("role");
const number = document.getElementById("number");

async function loadPhone() {

    const response = await fetch("/phone/" + encodeURIComponent(role.value));

    const data = await response.json();

    number.value = data.number;

}

role.addEventListener("change", loadPhone);

loadPhone();

const save = document.getElementById("save");

const message = document.getElementById("message");

const codeModal = document.getElementById("codeModal");
const adminCode = document.getElementById("adminCode");
const confirmBtn = document.getElementById("confirmBtn");
const cancelBtn = document.getElementById("cancelBtn");

async function savePhone(){

    const response = await fetch("/update_phone", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            role: role.value,
            number: number.value

        })

    });

    const data = await response.json();

    if (data.success){

        message.innerHTML = "✅ המספר נשמר בהצלחה";
    
        message.style.color = "#16A34A";
    
        message.style.fontWeight = "bold";
    
        message.style.textAlign = "center";
    
        setTimeout(function(){
    
            message.innerHTML = "";
    
        },2000);
    
    }

}
    
save.addEventListener("click", function(){

    codeModal.style.display = "flex";

});

cancelBtn.addEventListener("click", function(){

    codeModal.style.display = "none";

});

confirmBtn.addEventListener("click", async function(){

    const response = await fetch("/verify_code", {

        method: "POST",

        headers:{
            "Content-Type":"application/json"
        },

        body: JSON.stringify({

            code: adminCode.value

        })

    });

    const data = await response.json();

    if(!data.success){

        adminCode.value = "";

        adminCode.placeholder = "❌ קוד שגוי";

        adminCode.focus();

        return;

    }

    codeModal.style.display = "none";

    savePhone();

});

</script>

</body>

</html>
