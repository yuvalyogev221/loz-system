<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

    <meta charset="UTF-8">
    <title>ניהול מספרי טלפון</title>

    <style>

        body{

            margin:0;
            background:#EEF3FA;
            font-family:Arial;
            display:flex;
            flex-direction:column;
            align-items:center;

        }

        h1{

            margin-top:50px;
        
            text-align:center;
        
            color:#173B78;
        
            font-size:38px;
        
            line-height:1.4;
        
            font-weight:700;
        
        }

        .card{

            width:90%;
            max-width:520px;
        
            background:white;
        
            margin-top:35px;
        
            padding:45px;
        
            border-radius:28px;
        
            box-shadow:
                0 12px 35px rgba(0,0,0,.10);
        
            transition:.25s;
        
        }

        h2{

            text-align:center;
            color:#2E5CB8;
            margin-bottom:35px;

        }

        label{

            display:block;
            margin-top:20px;
            margin-bottom:8px;
            font-weight:bold;

        }

        select,
        input{

            width:100%;
            padding:15px;
            font-size:18px;
            border-radius:10px;
            border:1px solid #CCC;
            box-sizing:border-box;

        }

        button{

            width:100%;
            margin-top:35px;
            padding:15px;
            font-size:20px;
            border:none;
            border-radius:10px;
            background:#2F63E6;
            color:white;
            cursor:pointer;

        }

        button:hover{

            background:#214CB7;

        }

    </style>

</head>

<body>

<h1>ניהול מספרי טלפון</h1>

<div class="card">

    <h2>✏️ עריכת איש קשר</h2>

    <label>👤 תפקיד</label>

    <select id="role">

        {% for phone in phones %}

        <option value="{{ phone[0] }}">
            {{ phone[0] }}
        </option>

        {% endfor %}

    </select>

    <label>📞 מספר טלפון</label>

    <input
        id="number"
        type="text"
    >

    <button id="save">

        💾 שמור

    </button>

    <p id="message"></p>

</div>

<script>

const role = document.getElementById("role");
const number = document.getElementById("number");

async function loadPhone() {

    const response = await fetch("/phone/" + encodeURIComponent(role.value));

    const data = await response.json();

    number.value = data.number;

}

role.addEventListener("change", loadPhone);

loadPhone();

const save = document.getElementById("save");

const message = document.getElementById("message");
    
save.addEventListener("click", async function () {

    const response = await fetch("/update_phone", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            role: role.value,
            number: number.value

        })

    });

    const data = await response.json();

    if (data.success){

        message.innerHTML = "✅ המספר נשמר בהצלחה";
    
        message.style.color = "#16A34A";
    
        message.style.fontWeight = "bold";
    
        message.style.textAlign = "center";
    
        setTimeout(function(){
    
            message.innerHTML = "";
    
        },2000);
    
    }

});

</script>

</body>

</html>
