<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>ניהול מספרי טלפון</title>

    <style>

        body{

    margin:0;

    background:#EEF3FA;

    font-family:Arial;

    display:flex;

    flex-direction:column;

    align-items:center;

}

h1{

    margin-top:50px;

    color:#173B78;

    font-size:42px;

}

.card{

    width:600px;

    background:white;

    margin-top:40px;

    border-radius:18px;

    padding:40px;

    box-shadow:0px 8px 25px rgba(0,0,0,.08);

}

h2{

    text-align:center;

    color:#2E5CB8;

    margin-bottom:35px;

}

label{

    display:block;

    margin-top:20px;

    margin-bottom:8px;

    font-weight:bold;

}

select,input{

    width:100%;

    padding:15px;

    font-size:18px;

    border-radius:10px;

    border:1px solid #CCC;

    box-sizing:border-box;

}

button{

    width:100%;

    margin-top:35px;

    padding:15px;

    font-size:20px;

    border:none;

    border-radius:10px;

    background:#2F63E6;

    color:white;

    cursor:pointer;

}

button:hover{

    background:#214CB7;

}

    </style>

</head>

<body>

<h1>ניהול מספרי טלפון</h1>

<div class="card">

    <h2>✏️ עריכת איש קשר</h2>

    <label>תפקיד</label>

    <select>

        {% for phone in phones %}

        <option>
            {{ phone[0] }}
        </option>

        {% endfor %}

    </select>

    <label>מספר טלפון</label>

    <input
        type="text"
        value=""
    >

    <button>

        💾 שמור

    </button>

</div>

</body>

</html>
